# Builds the aarch64 add-on image on GitHub's runners and publishes it to ghcr.io,
# so the Home Assistant Supervisor pulls a finished image instead of compiling the
# kcp C extension on the Pi. PyPI ships no aarch64 Linux wheel for kcp, so a source
# build always compiles; this is the only way to keep that compile off the host.
#
# Build only. Tests are run locally by design (python tests/run_tests.py).

name: Build add-on image

on:
  push:
    branches: [main]
    # GitHub rejects a workflow that sets both paths and paths-ignore on one event, and a
    # rejected workflow fails instantly with zero jobs. Exclusions therefore use "!" inside
    # paths. The excluded files never enter the image: the Dockerfile copies only
    # requirements.txt, bridge/ and run.sh.
    paths:
      - "ubox_p4p_bridge/**"
      - "!ubox_p4p_bridge/DOCS.md"
      - "!ubox_p4p_bridge/CHANGELOG.md"
      - "!ubox_p4p_bridge/translations/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read version and image name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' ubox_p4p_bridge/config.yaml)"
          test -n "$version" || { echo "could not read version from config.yaml" >&2; exit 1; }
          # The image: key in config.yaml must match what we push; derive it from there.
          image_template="$(sed -nE 's/^image:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' ubox_p4p_bridge/config.yaml)"
          test -n "$image_template" || { echo "config.yaml has no image: key" >&2; exit 1; }
          image="${image_template//\{arch\}/aarch64}"
          # ghcr.io requires a lowercase namespace; the repository owner is mixed case.
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image"     >> "$GITHUB_OUTPUT"
          echo "building $image:$version"

      - name: Refuse to overwrite a published version
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Anonymous token is enough to check for existence on a public package. On a
          # private package this returns 401/404, which we treat as "not published".
          repo_path="${IMAGE#ghcr.io/}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo_path}:pull" | sed -nE 's/.*"token":"([^"]+)".*/\1/p' || true)"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer ${token}" \
                   -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
                   "https://ghcr.io/v2/${repo_path}/manifests/${VERSION}" || echo 000)"
          if [ "$code" = "200" ]; then
            echo "::error::${IMAGE}:${VERSION} already exists. Bump version in config.yaml; published versions are immutable."
            exit 1
          fi
          echo "version ${VERSION} not yet published (HTTP ${code}); proceeding"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ubox_p4p_bridge
          file: ubox_p4p_bridge/Dockerfile
          platforms: linux/arm64
          push: true
          # Attestation manifests add an "unknown/unknown" platform entry that confuses
          # some pullers; the Supervisor only wants the plain arm64 image.
          provenance: false
          sbom: false
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=aarch64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed image
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          echo
          echo "Published ${IMAGE}:${VERSION}"
          echo "If this is the first publish, make the package PUBLIC in GitHub -> Packages,"
          echo "or the Supervisor cannot pull it."
